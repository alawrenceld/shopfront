<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopfront</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Shopfront</h1>
      <p class="tagline" id="tagline"></p>
      <nav class="main-nav" id="main-nav" hidden>
        <a href="#products" data-view="products">Products</a>
        <a href="#wishlist" data-view="wishlist">Wishlist (<span id="wishlist-count">0</span>)</a>
      </nav>
    </div>
  </header>
  <div id="promo" class="promo" hidden></div>
  <div id="wishlist-message" class="wishlist-message" role="alert" hidden></div>
  <main>
    <section id="products-view">
      <h2>Products</h2>
      <form class="search-row" id="search-form" role="search" hidden>
        <label for="search">Search</label>
        <input id="search" type="search" placeholder="Search products by name" autocomplete="off" />
      </form>
      <div class="filters" id="filters" hidden>
        <button class="filter active" data-category="">All</button>
        <button class="filter" data-category="beans">Beans</button>
        <button class="filter" data-category="gear">Gear</button>
      </div>
      <div class="sort-row" hidden>
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="">Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </div>
      <div id="products" class="grid"></div>
      <p id="no-results" class="no-results" hidden>No products match your search.</p>
    </section>
    <section id="wishlist-view" hidden>
      <h2>Wishlist</h2>
      <div id="wishlist-items" class="wishlist-items"></div>
      <p id="wishlist-empty" class="no-results" hidden>
        Your wishlist is empty — save something you love from the <a href="#products">products</a>.
      </p>
    </section>
    <aside>
      <h2>Cart</h2>
      <div id="cart"></div>
      <input id="discount" type="text" placeholder="Discount code" autocomplete="off" hidden />
      <button id="checkout" disabled>Checkout</button>
      <div id="order-result" hidden></div>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
